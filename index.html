<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Siêu Cấp - Tăng Kịch Tính</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin-bottom: 5px;
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        #game-container {
            background: #2f3542;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .control-panel {
            margin-bottom: 15px;
        }

        select, button {
            padding: 8px 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            background: #ff4757;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        select {
            background: #57606f;
            margin-right: 10px;
        }

        button:hover, select:hover {
            background: #ff6b81;
        }

        #status-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #57606f;
            padding: 10px 20px;
            border-radius: 5px;
            gap: 15px;
        }

        #danger-level {
            color: #ffa502;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; text-shadow: 0 0 8px #ffa502; }
        }

        #board {
            display: grid;
            gap: 4px;
            background: #747d8c;
            padding: 6px;
            border-radius: 8px;
            margin: 0 auto;
            max-width: 90vw;
            max-height: 70vh;
            overflow: auto;
        }

        .cell {
            width: 35px;
            height: 35px;
            background: #a4b0be;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.1s ease;
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), inset 0 -3px 0 rgba(0,0,0,0.2);
        }

        .cell:hover {
            background: #ced6e0;
        }

        .cell.revealed {
            background: #dfe4ea;
            color: #2f3542;
            box-shadow: none;
            cursor: default;
        }

        .cell.mine {
            background: #ff4757 !important;
            animation: shake 0.15s linear infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }

        .cell.flagged {
            background: #eccc68;
        }

        /* Màu sắc số lượng mìn xung quanh */
        .c-1 { color: #1e90ff; }
        .c-2 { color: #2ed573; }
        .c-3 { color: #ff6348; }
        .c-4 { color: #3742fa; }
        .c-5 { color: #8b22bb; }
        .c-6 { color: #05c46b; }
        .c-7 { color: #ff3f34; }
        .c-8 { color: #000000; }
    </style>
</head>
<body>

    <h1>💣 MINESWEEPER KHẨN CẤP 💣</h1>
    
    <div id="game-container">
        <div class="control-panel">
            <select id="difficulty-select" onchange="changeDifficulty()">
                <option value="easy">Dễ (8x8 - 10 mìn)</option>
                <option value="medium" selected>Vừa (12x12 - 20 mìn)</option>
                <option value="hard">Khó (16x16 - 40 mìn)</option>
            </select>
            <button onclick="initGame()">Chơi lại</button>
        </div>

        <div id="status-panel">
            <div>⏱ Thời gian: <span id="timer">0</span>s</div>
            <div>⚡ Trạng thái: <span id="danger-level">Bình thường</span></div>
            <div>💣 Mìn ẩn: <span id="mine-count">0</span></div>
        </div>
        
        <div id="board"></div>
    </div>

    <script>
        // Cấu hình chế độ chơi mặc định
        let rows = 12;
        let cols = 12;
        let baseMines = 20;
        
        let board = [];
        let revealedCount = 0;
        let gameOver = false;
        let timerInterval = null;
        let dangerInterval = null;
        let timeElapsed = 0;
        let currentMines = baseMines;
        let flagsCount = 0;

        // Khởi tạo Web Audio API giả lập âm thanh kỹ thuật số
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'flag') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(550, now);
                osc.frequency.exponentialRampToValueAtTime(250, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'explode') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(10, now + 0.5);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'alert') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(700, now);
                osc.frequency.setValueAtTime(500, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'win') {
                // Sửa chuỗi nốt nhạc chiến thắng vui tươi
                const notes = [261.63, 329.63, 392.00, 523.25]; // Đồ - Mi - Sol - Đố
                notes.forEach((freq, index) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + index * 0.1);
                    g.gain.setValueAtTime(0.15, now + index * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + index * 0.1 + 0.2);
                    o.start(now + index * 0.1);
                    o.stop(now + index * 0.1 + 0.2);
                });
            }
        }

        // Thay đổi cấp độ chơi
        function changeDifficulty() {
            const level = document.getElementById('difficulty-select').value;
            if (level === 'easy') {
                rows = 8; cols = 8; baseMines = 10;
            } else if (level === 'medium') {
                rows = 12; cols = 12; baseMines = 20;
            } else if (level === 'hard') {
                rows = 16; cols = 16; baseMines = 40;
            }
            initGame();
        }

        // Khởi tạo lại toàn bộ trạng thái
        function initGame() {
            gameOver = false;
            timeElapsed = 0;
            currentMines = baseMines;
            flagsCount = 0;
            revealedCount = 0;
            board = [];
            
            document.getElementById('timer').textContent = timeElapsed;
            document.getElementById('danger-level').textContent = "Bình thường";
            document.getElementById('danger-level').style.color = "#ffa502";
            document.getElementById('mine-count').textContent = currentMines;

            clearInterval(timerInterval);
            clearInterval(dangerInterval);

            // Bắt đầu đếm thời gian
            timerInterval = setInterval(() => {
                timeElapsed++;
                document.getElementById('timer').textContent = timeElapsed;
            }, 1000);

            // Cơ chế TĂNG ĐỘ KHÓ: Cứ mỗi 10 giây tăng độ nguy hiểm và rải thêm mìn!
            dangerInterval = setInterval(() => {
                if(gameOver) return;
                playSound('alert');

                if (timeElapsed >= 30) {
                    document.getElementById('danger-level').textContent = "🚨 BÁO ĐỘNG ĐỎ";
                    document.getElementById('danger-level').style.color = "#ff4757";
                    spawnRandomMine(); // Thả thêm mìn vào ô chưa mở
                } else if (timeElapsed >= 15) {
                    document.getElementById('danger-level').textContent = "⚠️ Nguy hiểm";
                    document.getElementById('danger-level').style.color = "#ff7f50";
