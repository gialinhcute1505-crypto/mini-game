<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Siêu Cấp - Bản Sửa Lỗi Triệt Để</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            margin: 10px 0 5px 0;
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
            font-size: 1.8rem;
        }

        #game-container {
            background: #2f3542;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .control-panel {
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        select, button {
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            background: #ff4757;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        select {
            background: #57606f;
        }

        .mode-panel {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-mode {
            background: #747d8c;
            flex: 1;
            padding: 10px;
            font-size: 1rem;
        }

        .btn-mode.active {
            background: #2ed573;
            box-shadow: 0 0 10px rgba(46, 213, 115, 0.6);
        }

        #status-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            background: #57606f;
            padding: 8px 15px;
            border-radius: 5px;
        }

        #danger-level {
            color: #ffa502;
        }

        #board {
            display: grid;
            gap: 4px;
            background: #747d8c;
            padding: 6px;
            border-radius: 8px;
            margin: 0 auto;
            justify-content: center;
        }

        .cell {
            width: 35px;
            height: 35px;
            background: #a4b0be;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.4), inset 0 -3px 0 rgba(0,0,0,0.2);
        }

        .cell.revealed {
            background: #dfe4ea;
            color: #2f3542;
            box-shadow: none;
            cursor: default;
        }

        .cell.mine {
            background: #ff4757 !important;
        }

        .cell.flagged {
            background: #eccc68;
        }

        .c-1 { color: #1e90ff; }
        .c-2 { color: #2ed573; }
        .c-3 { color: #ff6348; }
        .c-4 { color: #3742fa; }
        .c-5 { color: #8b22bb; }
        .c-6 { color: #05c46b; }
        .c-7 { color: #ff3f34; }
        .c-8 { color: #000000; }
    </style>
</head>
<body>

    <h1>💣 DÒ MÌN KHẨN CẤP 💣</h1>
    
    <div id="game-container">
        <div class="control-panel">
            <select id="difficulty-select" onchange="changeDifficulty()">
                <option value="easy">Dễ (8x8)</option>
                <option value="medium" selected>Vừa (10x10)</option>
            </select>
            <button onclick="initGame()">Chơi lại</button>
        </div>

        <!-- BẢN NÂNG CẤP CHỌN CHẾ ĐỘ CLICK ĐỂ TRÁNH LỖI ĐƠ CHUỘT -->
        <div class="mode-panel">
            <button id="mode-dig" class="btn-mode active" onclick="setPlayMode('dig')">⛏️ Mở Ô</button>
            <button id="mode-flag" class="btn-mode" onclick="setPlayMode('flag')">🚩 Cắm Cờ</button>
        </div>

        <div id="status-panel">
            <div>⏱ <span id="timer">0</span>s</div>
            <div>⚡ <span id="danger-level">Bình thường</span></div>
            <div>💣 <span id="mine-count">0</span></div>
        </div>
        
        <div id="board"></div>
    </div>

    <script>
        let rows = 10;
        let cols = 10;
        let baseMines = 12;
        
        let board = [];
        let revealedCount = 0;
        let gameOver = false;
        let timerInterval = null;
        let dangerInterval = null;
        let timeElapsed = 0;
        let currentMines = baseMines;
        let flagsCount = 0;
        let playMode = 'dig'; // 'dig' hoặc 'flag'

        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function playSound(type) {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'flag') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(550, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'explode') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'alert') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        // Chuyển đổi chế độ thao tác: Mở ô / Cắm cờ
        function setPlayMode(mode) {
            playMode = mode;
            document.getElementById('mode-dig').classList.toggle('active', mode === 'dig');
            document.getElementById('mode-flag').classList.toggle('active', mode === 'flag');
            initAudio();
        }

        function changeDifficulty() {
            const level = document.getElementById('difficulty-select').value;
            if (level === 'easy') {
                rows = 8; cols = 8; baseMines = 8;
            } else if (level === 'medium') {
                rows = 10; cols = 10; baseMines = 12;
            }
            initGame();
        }

        function initGame() {
            gameOver = false;
            timeElapsed = 0;
            currentMines = baseMines;
            flagsCount = 0;
            revealedCount = 0;
            board = [];
            setPlayMode('dig');
            
            document.getElementById('timer').textContent = timeElapsed;
            document.getElementById('danger-level').textContent = "An toàn";
            document.getElementById('danger-level').style.color = "#2ed573";
            document.getElementById('mine-count').textContent = currentMines;

            clearInterval(timerInterval);
            clearInterval(dangerInterval);

            timerInterval = setInterval(() => {
                if(gameOver) return;
                timeElapsed++;
                document.getElementById('timer').textContent = timeElapsed;
            }, 1000);

            // Tăng độ khó: Mỗi 10 giây thả thêm 1 quả mìn ẩn kịch tính
            dangerInterval = setInterval(() => {
                if(gameOver) return;
                playSound('alert');
                if (timeElapsed >= 20) {
                    document.getElementById('danger-level').textContent = "🚨 NGUY HIỂM";
                    document.getElementById('danger-level').style.color = "#ff4757";
                    spawnRandomMine();
                } else if (timeElapsed >= 10) {
                    document.getElementById('danger-level').textContent = "⚠️ Cảnh báo";
                    document.getElementById('danger-level').style.color = "#ffa502";
                    spawnRandomMine();
                }
            }, 10000);

            createBoard();
        }

        function createBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            boardElement.style.gridTemplateRows = `repeat(${rows}, 35px)`;
            boardElement.style.gridTemplateColumns = `repeat(${cols}, 35px)`;

            for (let r = 0; r < rows; r++) {
                board[r] = [];
                for (let c = 0; c < cols; c++) {
                    board[r][c] = {
                        row: r, col: c,
                        isMine: false, isRevealed: false, isFlagged: false,
                        neighborMines: 0, element: null
};
const cellEl = document.createElement('div');
cellEl.classList.add('cell');
// Click chuột trái thông thường xử lý cho cả điện thoại và máy tính
cellEl.addEventListener('click', () => handleCellAction(r, c));
boardElement.appendChild(cellEl);
board[r][c].element = cellEl;
}
}
let minesPlaced = 0;
while (minesPlaced < currentMines) {
const r = Math.floor(Math.random() * rows);
const c = Math.floor(Math.random() * cols);
if (!board[r][c].isMine) {
board[r][c].isMine = true;
minesPlaced++;
}
}
calculateNeighbors();
}
function calculateNeighbors() {
for (let r = 0; r < rows; r++) {
for (let c = 0; c < cols; c++) {
if (board[r][c].isMine) continue;
let count = 0;
for (let i = -1; i <= 1; i++) {
for (let j = -1; j <= 1; j++) {
if (board[r + i] && board[r + i][c + j] && board[r + i][c + j].isMine) {
count++;
}
}
}
board[r][c].neighborMines = count;
}
}
}
// Xử lý hành động tùy thuộc vào chế độ đang chọn (Mở ô hoặc Cắm cờ)
function handleCellAction(r, c) {
initAudio();
if (gameOver || board[r][c].isRevealed) return;
if (playMode === 'flag') {
// Hành động CẮM CỜ
const cell = board[r][c];
playSound('flag');
if (!cell.isFlagged) {
cell.isFlagged = true;
cell.element.classList.add('flagged');
cell.element.innerHTML = '🚩';
flagsCount++;
} else {
cell.isFlagged = false;
cell.element.classList.remove('flagged');
cell.element.innerHTML = '';
flagsCount--;
}
document.getElementById('mine-count').textContent = currentMines - flagsCount;
} else {
// Hành động MỞ Ô
if (board[r][c].isFlagged) return;
revealCell(r, c);
}
}
function revealCell(r, c) {
if (board[r][c].isRevealed || board[r][c].isFlagged) return;
const cell = board[r][c];
cell.isRevealed = true;
revealedCount++;
if (cell.isMine) {
playSound('explode');
cell.element.classList.add('mine');
cell.element.innerHTML = '💣';
endGame(false);
return;
}
playSound('click');
cell.element.classList.add('revealed');
if (cell.neighborMines > 0) {
cell.element.textContent = cell.neighborMines;
cell.element.classList.add(c-${cell.neighborMines});
} else {
for (let i = -1; i <= 1; i++) {
for (let j = -1; j <= 1; j++) {
if (board[r + i] && board[r + i][c + j]) {
revealCell(r + i, c + j);
}
}
}
}
checkWinCondition();
}
function spawnRandomMine() {
let emptyCells = [];
for (let r = 0; r < rows; r++) {
for (let c = 0; c < cols; c++) {
if (!board[r][c].isRevealed && !board[r][c].isMine) {
emptyCells.push(board[r][c]);
}
}
}
if (emptyCells.length > 1) {
const targetCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
targetCell.isMine = true;
currentMines++;
document.getElementById('mine-count').textContent = currentMines - flagsCount;
calculateNeighbors();
for (let r = 0; r < rows; r++) {
for (let c = 0; c < cols; c++) {
if (board[r][c].isRevealed && !board[r][c].isMine) {
let count = 0;
for (let i = -1; i <= 1; i++) {
for (let j = -1; j <= 1; j++) {
if (board[r + i] && board[r + i][c + j] && board[r + i][c + j].isMine) {
count++;
}
}
}
board[r][c].neighborMines = count;
if (count > 0) {
board[r][c].element.textContent = count;
board[r][c].element.className = cell revealed c-${count};
} else {
board[r][c].element.textContent = '';
board[r][c].element.className = cell revealed;
}
}
}
}
}
}
function checkWinCondition() {
if (revealedCount === (rows * cols) - currentMines) {
endGame(true);
}
}
function endGame(isWin) {
gameOver = true;
clearInterval(timerInterval);
clearInterval(dangerInterval);
for (let r = 0; r < rows; r++) {
for (let c = 0; c < cols; c++) {
if (board[r][c].isMine) {
board[r][c].element.classList.add('mine');
board[r][c].element.innerHTML = '💣';
}
}
}
setTimeout(() => {
alert(isWin ? "🎉 CHIẾN THẮNG!" : "💥 BÙM! Game Over!");
}, 100);
}
window.onload = initGame;



### 💡 Hướng dẫn chơi bản mới này để không bị lỗi:
1. Bạn nhấn nút **⛏️ Mở Ô** (đang sáng màu xanh), sau đó chạm/click vào các ô trên bảng để mở ô dò tìm bom.
2. Khi muốn đánh dấu ô có bom, bạn hãy nhấn nút **🚩 Cắm Cờ** phía trên, rồi click vào ô muốn khóa lại. Khi cắm cờ xong, nhớ nhấn lại nút **⛏️ Mở Ô** để tiếp tục chơi nhé!
